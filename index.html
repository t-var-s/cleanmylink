<!doctype html>
<html lang="en">
  <head>
    <!-- app-head -->
  </head>
  <body>
    <main class="app-shell">
      <div class="app-column">
        <section class="hero-stage">
          <div class="app-panel app-panel-hero">
            <div class="hero-copy">
              <p class="eyebrow">Clipboard utility</p>
              <h1 class="visually-hidden">Clean My Link</h1>
              <p id="status-message" class="status-message" role="status">
                Remove junk parameters from any URL you paste, type or drop in.
              </p>
            </div>

            <form id="clean-form" class="clean-form">
              <label class="visually-hidden" for="clean-input">Link or text to clean</label>
              <div class="clean-stage" data-state="idle">
                <textarea
                  id="clean-input"
                  class="clean-input"
                  rows="1"
                  placeholder="Paste a link here"
                  autocomplete="off"
                  autocapitalize="off"
                  enterkeyhint="done"
                ></textarea>
                <output id="clean-output" class="clean-output" for="clean-input" aria-hidden="true" hidden></output>
              </div>
              <div class="clean-actions">
                <button id="clean-button" class="push-button clean-button" type="button">
                  <span class="clean-button-label">Paste</span>
                  <span class="button-loading" aria-hidden="true">
                    <span class="button-spinner"></span>
                  </span>
                </button>
              </div>
            </form>

            <p class="hero-credit">
              Web app built by
              <a href="https://viewfromtheweb.com" target="_blank" rel="noopener noreferrer">Ricardo Tavares</a>
            </p>
          </div>
        </section>

        <section class="history-section" aria-labelledby="history-heading">
          <div class="history-header">
            <div>
              <p class="section-label">Recent Links</p>
              <h2 id="history-heading">Saved for 72 hours.</h2>
            </div>
          </div>
          <div class="history-body">
            <ul id="history-list" class="history-list"></ul>
            <p id="history-empty" class="history-empty" aria-live="polite">Loading saved links from this device...</p>
          </div>
        </section>
      </div>
    </main>

    <a class="push-button settings-link" href="/settings.html" aria-label="Open settings">
      <img src="/assets/icon_settings.webp" alt="" width="318" height="318">
    </a>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
