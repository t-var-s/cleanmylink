version: 1
verified_on: 2026-10-07

automated:
  - id: diff-tokenizer
    type: unit
    file: test/diff.test.js
    command: npm test
    covers:
      - tokenize splits on URL delimiters and whitespace and keeps them as tokens
      - joining the tokens gives the original text back

  - id: diff-segments
    type: unit
    file: test/diff.test.js
    command: npm test
    covers:
      - removed query parameters appear as removed segments
      - a host rewrite appears as removed plus added segments
      - identical strings yield a single same segment
      - a plain-text whitespace collapse is represented as removed plus added whitespace
      - same plus removed segments rebuild the input and same plus added segments rebuild the output
      - input above the token cap falls back to one removed and one added segment

  - id: transforms-tracking-params
    type: unit
    file: test/transforms.test.js
    command: npm test
    covers:
      - cleanUrl removes generic tracking parameters
      - cleanUrl preserves unrelated query parameters

  - id: transforms-settings-metadata
    type: unit
    file: test/transforms.test.js
    command: npm test
    covers:
      - transform definitions expose stable ids
      - transform definitions expose labels, types, and default enabled state for settings UI
      - site-rule transform definitions expose domain labels for settings UI

  - id: storage-domain-transform-settings
    type: unit
    file: test/storage.test.js
    command: npm test
    covers:
      - domain transform settings persist through the shared storage adapter
      - only site-rule transform ids are serialized
      - global cleanup transform ids are ignored

  - id: storage-domain-settings-global-cleanup
    type: unit
    file: test/storage.test.js
    command: npm test
    covers:
      - disabled domain transforms are composed with default global cleanup settings
      - tracking parameter cleanup remains enabled even if a saved settings payload includes it as disabled

  - id: storage-domain-settings-malformed
    type: unit
    file: test/storage.test.js
    command: npm test
    covers:
      - malformed domain settings storage falls back to default-enabled site rules

  - id: storage-domain-settings-defaults
    type: unit
    file: test/storage.test.js
    command: npm test
    covers:
      - missing domain transform ids fall back to default-enabled site rules
      - invalid non-boolean domain transform values fall back to defaults

  - id: storage-indexeddb-adapter
    type: unit
    file: test/storage.test.js
    command: npm test
    covers:
      - IndexedDB-backed storage persists history entries
      - IndexedDB-backed storage persists domain transform settings
      - IndexedDB-backed domain settings serialize only site-rule transform ids

  - id: storage-indexeddb-migration
    type: unit
    file: test/storage.test.js
    command: npm test
    covers:
      - missing IndexedDB history is copied from localStorage and returned
      - missing IndexedDB domain settings are copied from localStorage and returned
      - existing IndexedDB values take precedence over localStorage migration values
      - localStorage migration values are left in place after copy

  - id: storage-indexeddb-fallback
    type: unit
    file: test/storage.test.js
    command: npm test
    covers:
      - localStorage-compatible storage is used when IndexedDB cannot open

  - id: transforms-disabled-tracking-params
    type: unit
    file: test/transforms.test.js
    command: npm test
    covers:
      - cleanUrl can leave tracking parameters in place when the transform is disabled

  - id: transforms-x-rewrite
    type: unit
    file: test/transforms.test.js
    command: npm test
    covers:
      - cleanUrl rewrites x.com status URLs to fxtwitter.com

  - id: transforms-disabled-x-rewrite
    type: unit
    file: test/transforms.test.js
    command: npm test
    covers:
      - cleanUrl can leave x.com status URLs unchanged when the transform is disabled

  - id: transforms-x-article-exception
    type: unit
    file: test/transforms.test.js
    command: npm test
    covers:
      - x.com article URLs are not host-rewritten
      - tracking cleanup still runs on article URLs

  - id: transforms-reddit-rewrite
    type: unit
    file: test/transforms.test.js
    command: npm test
    covers:
      - cleanUrl rewrites reddit.com URLs to redlib.freedit.eu

  - id: transforms-youtube-v-only
    type: unit
    file: test/transforms.test.js
    command: npm test
    covers:
      - cleanUrl keeps only the v parameter on YouTube watch URLs

  - id: transforms-whitespace-split-url
    type: unit
    file: test/transforms.test.js
    command: npm test
    covers:
      - cleanInput treats whitespace-split URLs as URLs
      - cleanInput removes whitespace from URL candidates before parsing

  - id: transforms-text-normalization
    type: unit
    file: test/transforms.test.js
    command: npm test
    covers:
      - cleanText collapses repeated whitespace
      - cleanText converts all-caps text to sentence case

  - id: transforms-disabled-text-case
    type: unit
    file: test/transforms.test.js
    command: npm test
    covers:
      - cleanText can leave all-caps text unchanged when the sentence-case transform is disabled

  - id: transforms-http-allowlist
    type: unit
    file: test/transforms.test.js
    command: npm test
    covers:
      - parseUrl accepts http and https URLs
      - parseUrl rejects non-http schemes

  - id: app-import-without-dom-side-effects
    type: unit
    file: test/app.test.js
    command: npm test
    covers:
      - app module can be imported in Node without querying browser DOM globals
      - app bootstrapping is separated from app factory exports

  - id: app-history-loading-state
    type: unit
    file: test/app.test.js
    command: npm test
    covers:
      - app keeps the saved-links loading copy visible until history storage resolves
      - app clears the history loading busy state after startup history loading completes

  - id: app-history-read-fallback
    type: unit
    file: test/app.test.js
    command: npm test
    covers:
      - app falls back to an empty in-memory history when saved history cannot be read
      - app logs history storage read failures without breaking startup

  - id: app-history-pruning
    type: unit
    file: test/app.test.js
    command: npm test
    covers:
      - app drops expired history entries during startup
      - app drops unsafe non-HTTP history URLs during startup
      - app writes pruned history entries back to storage

  - id: app-history-deduplication
    type: unit
    file: test/app.test.js
    command: npm test
    covers:
      - app de-duplicates saved URLs so the newest clean wins
      - app ignores unsafe URLs when saving history

  - id: app-history-limit
    type: unit
    file: test/app.test.js
    command: npm test
    covers:
      - app caps saved history at 100 entries
      - saving a new URL pushes the oldest over-limit history entry out of storage

  - id: app-clipboard-cleaning
    type: unit
    file: test/app.test.js
    command: npm test
    covers:
      - app cleans clipboard URLs with saved domain-transform settings
      - app writes cleaned URL output back to the clipboard
      - app saves cleaned URL results to history
      - app writes cleaned plain-text output back to the clipboard
      - app does not save plain-text results to history

  - id: app-clipboard-edge-states
    type: unit
    file: test/app.test.js
    command: npm test
    covers:
      - unchanged valid URL input still reports "All clear!"
      - clicking the paste target starts the clipboard read before disabling the control
      - unexpected clipboard failures report the generic failure message
      - the primary button is restored after an unexpected clipboard failure

  - id: app-paste-target
    type: unit
    file: test/app.test.js
    command: npm test
    covers:
      - in idle the control reads "Click to paste a link here", carries the paste-target class, and the stage has data-state "idle" and data-mode "paste"
      - clicking the target reads the clipboard and the stage moves to "cleaning" with the output shown and the mode still "paste", which the stylesheet uses to hide the target
      - after the animation and the hold the output is hidden, the stage is "idle", the mode is "paste", and no timer is pending
      - when navigator.clipboard.readText is unavailable, the click sets the status "Press Cmd+V or Ctrl+V to paste a link." and nothing else changes

  - id: app-document-paste
    type: unit
    file: test/app.test.js
    command: npm test
    covers:
      - a paste event on the document with a non-editable target cleans the pasted text, prevents the default, writes the result back, and saves URL results to history
      - document pastes targeting another input or a contenteditable region, or already handled, are ignored by the document handler
      - a whitespace-only paste is left to the browser default, with no write and no status change

  - id: app-drop-input
    type: unit
    file: test/app.test.js
    command: npm test
    covers:
      - dragenter and dragover accept text drags and highlight the hero panel
      - a drop prefers the first non-comment line of text/uri-list
      - a drop falls back to text/plain
      - drops carrying only files are left to the browser

  - id: app-stage-animation
    type: unit
    file: test/app.test.js
    command: npm test
    covers:
      - writeText is called before the output renders anything
      - the output shows the diff as span elements with tok-same, tok-removed, and tok-added classes filled through textContent
      - rendering the output sets data-state "cleaning" without is-animating and keeps the newest mobile history entry in view
      - is-animating is added after the 300 ms reveal, and the animation timeout counts from there
      - a second paste during the reveal cancels it and the new text gets its own reveal
      - a font-size transitionend on the output ends the animation, and other properties do not
      - without transitionend the animation ends 450 ms after the reveal
      - after the animation the plain clean string holds in the output with data-state "done" for 500 ms, then the output empties and the target returns
      - a second paste during the animation or the hold cancels the pending timer and shows only the new transformation
      - a switch to update mode cancels the display and its timer, and returning to paste mode sets the stage back to idle
      - an unchanged result skips the collapse, pulses the status, and still holds
      - an unexpected write-back failure clears the display and returns the stage to idle

  - id: app-stage-reduced-motion
    type: unit
    file: test/app.test.js
    command: npm test
    covers:
      - the stage finishes immediately when the injected matchMedia reports reduced motion, with no reveal, no output, no hold, and no pending timer
      - an unchanged result under reduced motion does not pulse the status
      - a refused write-back under reduced motion shows the Copy state at once, with the clean string in the output and selected

  - id: app-write-back-copy-fallback
    type: unit
    file: test/app.test.js
    command: npm test
    covers:
      - writeText rejecting with NotAllowedError switches the control to "Copy" once the animation ends and does not show the error status
      - after a refused write-back the output stays visible with the plain clean string, a Range selection covers it, no timer is pending, the stage data-state is "done", the mode is "copy", and the control carries the push-button class
      - tapping "Copy" writes lastResult.output, empties and hides the output, and returns the control to "Click to paste a link here" with the status still "All clear!"
      - a refused Copy keeps the "Copy" control and reports the blocked status
      - a new paste while Copy shows returns the mode to "paste" and starts the new transformation

  - id: app-history-responsive-ordering
    type: unit
    file: test/app.test.js
    command: npm test
    covers:
      - desktop history renders newest entries first
      - mobile history renders older entries above newer entries so the newest is closest to the action area

  - id: app-history-share-actions
    type: unit
    file: test/app.test.js
    command: npm test
    covers:
      - saved history entries call navigator.share with entry-derived URL data when the Web Share API can share them
      - saved history entries keep safe external-link attributes even when sharing is available
      - saved history links keep normal navigation behavior when the Web Share API is unavailable
      - saved history links keep normal navigation behavior when navigator.canShare rejects the entry payload
      - user-cancelled saved history shares are ignored without app errors

  - id: app-pwa-update-actions
    type: unit
    file: test/app.test.js
    command: npm test
    covers:
      - waiting service workers switch the primary button into offline retry mode when the device is offline
      - waiting service workers switch the primary button into update mode when the device is online
      - update activation posts a SKIP_WAITING message to the waiting worker

  - id: app-update-mode-target
    type: unit
    file: test/app.test.js
    command: npm test
    covers:
      - update and retry-update modes hide the output, set the stage data-state to "update" and data-mode to the mode, and give the control the push-button class
      - returning to paste mode restores the target look, the label "Click to paste a link here", the idle state, and the default status
      - document pastes and drops are ignored in update mode

  - id: settings-controller-domain-settings
    type: unit
    file: test/settings.test.js
    command: npm test
    covers:
      - settings app renders one toggle for each site-rule transform
      - settings app stages checkbox changes in memory without writing storage
      - settings app updates the save label when staged settings differ
      - settings app writes domain-transform settings only on submit
      - settings app returns to the main cleaning page after a successful save
      - settings app reports storage write failures without navigating

  - id: build-output-excludes-source-only-directories
    type: build
    file: test/build.test.js
    command: npm test
    covers:
      - dist contains the deployable app files
      - dist contains the settings page
      - dist excludes references, test, scripts, and src directories

  - id: build-generates-service-worker
    type: build
    file: test/build.test.js
    command: npm test
    covers:
      - generated sw.js includes a stamped cache version
      - generated sw.js includes built app shell assets
      - generated sw.js includes the settings page and settings entry
      - generated sw.js does not include unreplaced placeholders

  - id: build-generates-page-head-metadata
    type: build
    file: test/build.test.js
    command: npm test
    covers:
      - built HTML pages receive shared head metadata from the Vite page registry
      - built HTML pages carry the viewport meta width=device-width, initial-scale=1, interactive-widget=resizes-content
      - built HTML pages receive page-specific title and description metadata
      - built HTML pages do not contain the source app-head marker
      - built HTML pages use Vite-fingerprinted stylesheet assets

  - id: build-main-page-semantics
    type: build
    file: test/build.test.js
    command: npm test
    covers:
      - the built main page keeps a visually hidden h1 reading "Clean My Link"
      - the built main page renders the status as a p with role="status"
      - the status message is no longer the page heading

  - id: build-netlify-csp-alignment
    type: build
    file: test/build.test.js
    command: npm test
    covers:
      - the Netlify Content-Security-Policy response header matches the shared app CSP policy string

manual_verified:
  - id: browser-clean-url-success
    type: browser
    tool: playwright-cli
    setup:
      - start the app with npm run start
      - open http://127.0.0.1:5173
      - grant clipboard-read and clipboard-write permissions for that origin
    steps:
      - write "https://example.com/path?utm_source=test&keep=1" to the clipboard
      - click the paste target
    expected:
      - status becomes "All clear!"
      - clipboard becomes "https://example.com/path?keep=1"
      - one history item is saved

  - id: browser-empty-clipboard
    type: browser
    tool: playwright-cli
    setup:
      - start the app with npm run start
      - grant clipboard-read and clipboard-write permissions
      - ensure local storage is empty
      - write an empty string to the clipboard
    steps:
      - click the paste target
    expected:
      - status becomes "No text was found in your clipboard."
      - no history item is created

  - id: browser-text-cleanup
    type: browser
    tool: playwright-cli
    setup:
      - start the app with npm run start
      - grant clipboard-read and clipboard-write permissions
      - write "HELLO   WORLD.\nTHIS IS FINE." to the clipboard
    steps:
      - click the paste target
    expected:
      - clipboard becomes "Hello world. This is fine."
      - status becomes "All clear!"
      - history remains unchanged because the result is not a URL

  - id: browser-site-rules
    type: browser
    tool: playwright-cli
    setup:
      - start the app with npm run start
      - grant clipboard-read and clipboard-write permissions
    steps:
      - clean "https://x.com/someuser/status/42?utm_source=social"
      - clean "https://www.youtube.com/watch?v=abc123&utm_source=newsletter&t=90"
    expected:
      - x.com result becomes "https://fxtwitter.com/someuser/status/42"
      - YouTube result becomes "https://www.youtube.com/watch?v=abc123"
      - both cleaned URLs appear in recent links

  - id: browser-settings-domain-rules
    type: browser
    tool: playwright-cli
    setup:
      - start the app with npm run start
      - open http://127.0.0.1:5173
      - grant clipboard-read and clipboard-write permissions
    steps:
      - open settings from the top-right icon
      - turn off the reddit.com domain transform
      - confirm the save label changes to "Save changes and go back to cleaning"
      - click the save button
      - clean "https://www.reddit.com/r/node/comments/abc123/post?utm_source=share&keep=ok"
    expected:
      - navigation returns to the main cleaning page
      - clipboard becomes "https://www.reddit.com/r/node/comments/abc123/post?keep=ok"
      - tracking cleanup still applies
      - the reddit.com host rewrite does not apply

  - id: browser-settings-responsive-layout
    type: browser
    tool: playwright-cli
    setup:
      - start the app with npm run start
      - open http://127.0.0.1:5173/settings.html
    steps:
      - review the settings page at a mobile viewport around 390x844
      - review the settings page at a desktop viewport around 1440x900
      - review the main page at the same mobile and desktop viewports
      - review the main page at a tablet viewport around 760x900
    expected:
      - toggle text fits without overflow
      - the save label fits beside the square save icon button
      - the settings icon stays in the top-right corner on mobile without blocking primary controls
      - the settings icon stays in the bottom-right corner on desktop without blocking primary controls
      - the clean button, settings link, and settings save button share the same blue push-button look in rest, hover, pressed, focus-visible, and disabled states
      - at the tablet viewport the history header keeps the mobile top padding below the settings icon and the hero panel fills the 34rem column

  - id: browser-history-layout-ordering
    type: browser
    tool: playwright-cli
    setup:
      - start the app with npm run start
      - grant clipboard-read and clipboard-write permissions
      - clean at least two distinct URLs
    steps:
      - view the app at a mobile viewport around 390x844
      - view the app again at a desktop viewport wider than 960px
    expected:
      - mobile layout renders older cleaned links above newer ones and keeps the newest near the action panel
      - desktop layout renders newest links first

  - id: browser-safe-history-links
    type: browser
    tool: playwright-cli
    setup:
      - start the app with npm run start
      - grant clipboard-read and clipboard-write permissions
      - create at least one history entry
    steps:
      - use a browser where the Web Share API is unavailable for the saved link
      - inspect and tap a rendered history link
    expected:
      - target is "_blank"
      - rel is "noopener noreferrer"
      - the saved link opens in a new tab

  - id: browser-history-share-api
    type: browser
    tool: playwright-cli
    setup:
      - start the app with npm run start on a browser or device with Web Share API support
      - grant clipboard-read and clipboard-write permissions
      - create at least one history entry
    steps:
      - tap a rendered history link
    expected:
      - the saved link opens the native share sheet instead of a new tab
      - the shared payload contains the saved URL

  - id: browser-blocked-clipboard-state
    type: browser
    tool: playwright-cli
    setup:
      - start the app with npm run start
      - open the page without clipboard-read permission
    steps:
      - click the paste target
    expected:
      - status becomes "Clipboard access is blocked. Try allowing clipboard permissions."

  - id: browser-safari-clipboard-activation
    type: browser
    tool: manual Safari verification
    setup:
      - open the HTTPS deployment in Safari on iOS or macOS without pre-granting clipboard access
      - copy a URL from another app or origin
    steps:
      - click the paste target
      - confirm Safari immediately presents its native Paste control over the box
      - choose Paste
    expected:
      - the clipboard read is accepted as part of the primary-action user activation
      - the URL is cleaned and written back to the clipboard
      - status becomes "All clear!"

  - id: browser-paste-target-input-sources
    type: browser
    tool: playwright-cli
    setup:
      - start the app with npm run dev
      - open http://127.0.0.1:5173 at a mobile viewport around 390x844 and again at 1440x900
      - grant clipboard-read and clipboard-write permissions
      - seed at least six history entries
    steps:
      - write a URL with tracking parameters long enough to wrap past five lines to the clipboard and click the paste target
      - dispatch a document paste event carrying text/plain with another URL
      - dispatch dragenter and drop events carrying text/uri-list and text/plain on the hero panel
      - review the browser console
    expected:
      - in idle the target is a dashed blue box reading "Click to paste a link here" with a pointer cursor and no text caret, and the stage carries data-state "idle" and data-mode "paste"
      - clicking the target reads the clipboard, the status becomes "All clear!", the output takes the target's place without moving the panel, the clean URL holds, and the target returns empty
      - the output grows to five lines, then scrolls inside, and never widens the panel or the page
      - the newest mobile history entry stays above the panel while the output shows and after the clean
      - the document paste cleans without any element focused and the clipboard holds the clean result
      - the panel border and the target border highlight during the drag, and the drop cleans the text/uri-list value
      - no keyboard-related element exists on the page: no textarea, no form, no label
      - the console shows no Content-Security-Policy report or other error

  - id: browser-write-back-copy-fallback
    type: browser
    tool: playwright-cli
    setup:
      - start the app with npm run dev
      - grant clipboard-read and clipboard-write permissions
      - add an init script that makes the first navigator.clipboard.writeText call reject with a NotAllowedError DOMException
    steps:
      - at 390x844 and again at 1440x900, dispatch a document paste with a URL that has tracking parameters
      - press Cmd+C or Ctrl+C before tapping anything, then tap "Copy"
    expected:
      - after the reveal and the animation the control reads "Copy" as a push button beside the output, the status reads "All clear!", and the output shows the clean URL fully selected
      - the keyboard copy puts the clean URL on the clipboard without tapping Copy
      - the newest mobile history entry stays above the grown panel
      - after Copy the clipboard holds the clean URL, the output is hidden, the target reads "Click to paste a link here", and the status still reads "All clear!"

  - id: browser-transformation-animation
    type: browser
    tool: playwright-cli
    setup:
      - start the app with npm run dev
      - grant clipboard-read and clipboard-write permissions
      - seed at least six history entries
    steps:
      - at 390x844 and again at 1440x900, dispatch a document paste with a URL with tracking parameters long enough to fill several lines
      - capture the output during the 300 ms reveal, then pause document.getAnimations() at about 420 ms and 560 ms for screenshots
      - resume the animations and capture the hold, then the end state
      - repeat with https://x.com/someone/status/42?utm_source=x and capture frames at 0, 300, 400, 500, and 660 ms
    expected:
      - during the reveal the pasted text shows as plain tokens with no strike
      - at about 420 ms the removed tokens are dimmed and struck through, at about 560 ms they are collapsing
      - the host rewrite shows the old host shrinking while the new host grows in, and the output height does not change while tokens shrink at font-size 0
      - the output has the same box as the target, so the swap does not move the panel, and the page never scrolls horizontally
      - during the hold the plain clean URL shows and the target stays hidden
      - after the hold the target is back, empty, and the newest mobile history entry stays above the panel in every frame
      - the console shows no error

  - id: browser-reduced-motion
    type: browser
    tool: playwright-cli
    setup:
      - start the app with npm run dev
      - grant clipboard-read and clipboard-write permissions
      - 'run playwright-cli run-code "async page => await page.emulateMedia({ reducedMotion: ''reduce'' })"'
      - seed at least six history entries
    steps:
      - at 390x844 and again at 1440x900, dispatch a document paste with a URL with tracking parameters long enough to fill several lines
      - capture the first frame after the paste
      - make the first writeText call reject with a NotAllowedError DOMException and paste the URL again
    expected:
      - the first frame after the paste already shows the empty target, "All clear!", and the output hidden, with no reveal and no token animation
      - the end state matches the end state of the animated run
      - the refused write-back shows "Copy" beside the selected clean URL in the output within 100 ms
      - the console shows no error

  - id: browser-update-mode-layout
    type: browser
    tool: playwright-cli
    setup:
      - start the app with npm run dev, where service worker registration is skipped
      - seed at least six history entries
    steps:
      - at 390x844 and again at 1440x900, import /src/app.js in the page, create a second unbound app, and call ui.setPrimaryActionMode with "update", "retry-update", then "paste"
    expected:
      - in both update modes the output is hidden and the control spans the full row as a push button reading "Update Now" or "Try again"
      - the newest mobile history entry stays above the panel as its height changes
      - returning to "paste" shows the dashed box reading "Click to paste a link here" and the default status

  - id: browser-pwa-basics
    type: browser
    tool: playwright-cli
    setup:
      - build the app with npm run build
      - start the production preview with npm run preview
      - open http://127.0.0.1:4173
    steps:
      - wait for the page to settle
      - inspect service worker registrations
      - fetch manifest.webmanifest from the app origin
    expected:
      - one active service worker is registered for http://127.0.0.1:4173/
      - manifest.webmanifest responds with HTTP 200

known_failures:
  - id: ios-keyboard-gap
    observed_on: 2026-10-05
    build: 5d63186
    device: iPhone, iOS 27, Safari, preview alias textbox--cleanmylink-viewfromtheweb.netlify.app
    observed: tapping the text field lifted the hero panel to the top of the visible area with a blank band about half the screen tall between it and the keyboard
    cause: iOS panned the visual viewport to reveal the focused field before visualViewport.resize fired, and the body shrink did not undo the pan
    fix: 37289d6 scrolled the window back to the origin in the layout pass; verified in Safari on the same iPhone on 2026-10-05
    status: historical. a2607e4 removed the text field, the visual viewport code, and the keyboard with it, so the condition cannot occur. Kept as the record of why the app never opens the on-screen keyboard

